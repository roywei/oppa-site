<!doctype html>
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
body { position: relative; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #fff;
  background: radial-gradient(circle at 70% 30%, #ff5fa8 0, transparent 40%), linear-gradient(160deg, #2a4fd6 0%, #6d3bd6 55%, #d63b8f 100%); }
.rays { position: absolute; inset: -400px; background: repeating-conic-gradient(from 0deg at 50% 52%, #ffffff12 0 8deg, transparent 8deg 16deg); }
h1 { position: absolute; top: 46px; left: 0; right: 0; margin: 0; text-align: center; font-size: 118px; line-height: .88; font-weight: 900; letter-spacing: -4px; text-shadow: 0 10px 0 #2a1a6e; transform: rotate(-3deg); }
h1 small { display: block; font-size: 66px; letter-spacing: 2px; color: #ffd84d; }
h1 .y { color: #ffd84d; }
.face { position: absolute; left: 290px; top: 470px; width: 500px; transform: rotate(-8deg); filter: drop-shadow(0 30px 40px #0008); }
.face img { width: 500px; }
.b { position: absolute; max-width: 300px; padding: 18px 28px; border-radius: 34px; background: #fff; color: #171b27; font-size: 34px; font-weight: 600; box-shadow: 0 14px 30px #0004; }
.b i { display: block; font-size: 20px; font-style: normal; color: #8a93a8; }
.b1 { left: 36px; top: 470px; transform: rotate(-6deg); }
.b2 { right: 36px; top: 560px; transform: rotate(5deg); }
.b3 { left: 50px; top: 960px; transform: rotate(4deg); }
.b4 { right: 50px; top: 1010px; transform: rotate(-5deg); }
.done { background: #315eda; color: #fff; }
.foot { position: absolute; left: 60px; right: 60px; bottom: 56px; display: flex; align-items: end; justify-content: space-between; }
.foot p { margin: 0; font-size: 34px; font-weight: 700; line-height: 1.2; }
.foot p span { display: block; font-size: 24px; font-weight: 500; opacity: .85; }
.foot img { height: 84px; }
</style></head>
<body>
<div class="rays"></div>
<h1>OPPA<br><span class="y">GANGNAM</span><br>STYLE</h1>
<div class="face"><img src="../../assets/oppa-face-shades.png" alt=""></div>
<div class="b b1"><i>Grandma Rosa</i>who has pickup Thursday??</div>
<div class="b b2"><i>Mia</i>server is down AGAIN</div>
<div class="b b3 done">Sam has it. Dot is fixing the server 🛠️</div>
<div class="b b4"><i>Sam</i>ok you're the MVP</div>
<div class="foot"><p>Reads every message.<br>Hands the rest to your agents.<span>Open source · runs on your Mac · iMessage + Slack</span></p><img src="../../assets/oppa-wordmark-white.svg" alt="oppa"></div>
</body></html>
